<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Auli: the operating system for your dog's life</title>
<style>
  :root { --bg:#0e0d0b; --panel:#171512; --ink:#f4f0e8; --muted:#a39d90; --line:#2d2a24; --gold:#c9a35a; --gold-ink:#17130a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:48px 16px 120px; }
  .brand { font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); margin-bottom:40px; }
  h1 { font-size:clamp(2rem,6vw,2.875rem); line-height:1.1; margin:0 0 16px; font-weight:700; }
  .sub { color:var(--muted); font-size:1.125rem; margin:0 0 28px; }
  ul.points { padding:0; margin:0 0 32px; list-style:none; }
  ul.points li { padding:10px 0 10px 28px; position:relative; border-bottom:1px solid var(--line); }
  ul.points li::before { content:""; position:absolute; left:4px; top:19px; width:8px; height:8px; border-radius:50%; background:var(--gold); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; }
  fieldset { border:0; padding:0; margin:0 0 20px; }
  legend { font-weight:600; margin-bottom:4px; }
  .hint { color:var(--muted); font-size:.8125rem; margin:0 0 10px; }
  .prices { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .prices label { border:1px solid var(--line); border-radius:10px; padding:12px 8px; text-align:center; cursor:pointer; position:relative; }
  .prices input { position:absolute; opacity:0; inset:0; cursor:pointer; }
  .prices label:has(input:checked) { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  .prices label:has(input:focus-visible) { outline:2px solid var(--gold); outline-offset:2px; }
  .prices strong { display:block; font-size:1.25rem; }
  .prices span { color:var(--muted); font-size:.8125rem; }
  .field { display:block; margin-bottom:12px; }
  .field > span { display:block; font-size:.8125rem; color:var(--muted); margin-bottom:4px; }
  input[type=email], input[type=text], input[type=number] { width:100%; padding:13px; font:inherit; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:inherit; }
  input:focus-visible { outline:2px solid var(--gold); outline-offset:1px; }
  button.cta { width:100%; margin-top:8px; padding:15px; font:inherit; font-weight:700; color:var(--gold-ink); background:var(--gold); border:0; border-radius:10px; cursor:pointer; }
  .fine { color:var(--muted); font-size:.8125rem; margin:12px 0 0; }
  #done { display:none; border:1px solid var(--gold); border-radius:14px; padding:20px; }
  .switch { margin-top:28px; text-align:center; }
  a { color:var(--gold); }
  #consent { position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line); padding:12px 16px; display:none; }
  #consent div { max-width:640px; margin:0 auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #consent p { margin:0; flex:1 1 260px; font-size:.875rem; }
  #consent button { padding:8px 14px; font:inherit; border-radius:8px; border:1px solid var(--line); background:transparent; color:inherit; cursor:pointer; }
  #consent button.yes { background:var(--gold); border-color:var(--gold); color:var(--gold-ink); font-weight:600; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div class="brand">Auli</div>
  <h1 id="headline"></h1>
  <p class="sub" id="sub"></p>
  <ul class="points" id="points"></ul>

  <div class="panel">
    <form id="form" novalidate>
      <fieldset id="price-set">
        <legend id="price-legend"></legend>
        <p class="hint" id="price-hint"></p>
        <div class="prices" id="prices"></div>
      </fieldset>
      <label class="field" id="org-field" hidden><span>Organisation name</span><input id="org" type="text" autocomplete="organization"></label>
      <label class="field" id="dogs-field" hidden><span>Dogs currently in your care</span><input id="dogs" type="number" min="0" inputmode="numeric"></label>
      <label class="field"><span id="email-label"></span><input id="email" type="email" required autocomplete="email" placeholder="you@example.com"></label>
      <button class="cta" id="cta" type="submit"></button>
      <p class="fine" id="legal"></p>
    </form>
    <div id="done" role="status"></div>
  </div>

  <p class="switch fine"><a href="#" id="switch"></a></p>
  <p class="fine" style="text-align:center"><a href="#" id="dnss" hidden>Do not sell or share my personal information</a></p>
</main>

<div id="consent" role="dialog" aria-label="Cookie consent">
  <div>
    <p id="consent-text">We use cookies to measure which messages work. Accept analytics cookies?</p>
    <button id="consent-no" type="button">Decline</button>
    <button id="consent-yes" class="yes" type="button">Accept</button>
  </div>
</div>

<script>
/* ---------- CONFIG: edit before launch ---------- */
const CONFIG = {
  // Signups and events are POSTed here as JSON (text/plain, so no CORS preflight).
  // Works with a Google Apps Script web app, Formspree, or your own endpoint. Empty = console only.
  endpoint: '',
  // Auli is English-only today, so every market uses the same copy; only price and currency change.
  // Pricing points are placeholders for the Auli+ price test: replace with your real hypotheses.
  markets: {
    us: { currency: 'USD', locale: 'en-US', prices: [7.99, 12.99, 19.99], consent: false },
    uk: { currency: 'GBP', locale: 'en-GB', prices: [6.49, 9.99, 15.99], consent: true },
    ie: { currency: 'EUR', locale: 'en-IE', prices: [7.49, 11.99, 17.99], consent: true },
    nl: { currency: 'EUR', locale: 'en-NL', prices: [7.49, 11.99, 17.99], consent: true },
    de: { currency: 'EUR', locale: 'en-DE', prices: [7.49, 11.99, 17.99], consent: true }
  },
  // Only promise what is real today: records, vaccinations, reminders, documents, Auli Intelligence,
  // the nearby vet/pharmacy map and Auli+. Vet booking, pharmacy orders, insurance, emergency help,
  // the community feed and Pawbook are prototypes or sample content: do not add them to any copy
  // until real providers and data sit behind them.
  audiences: {
    dog: {
      headline: 'The operating system for your dog’s life.',
      sub: 'Health records, vaccinations, medications and an AI that actually knows your dog. One beautiful app.',
      points: [
        'Every record, vaccination and medication in one place, with reminders',
        'Auli Intelligence: care guidance grounded in your dog’s own profile',
        'Find nearby vets and pharmacies on a map, wherever you are'
      ],
      priceLegend: 'What would you pay each month for Auli+?',
      priceHint: 'Auli+ unlocks Auli Intelligence. Pick the price that feels fair; this is not a purchase.',
      cta: 'Join the waitlist',
      legalUS: 'No spam. Auli Intelligence supports, and does not replace, your vet.',
      legalEU: 'We will email once to confirm your address, then only about the Auli beta. Unsubscribe any time. Auli Intelligence supports, and does not replace, your vet. See our privacy policy.',
      doneEU: 'You are on the list. We will email you shortly to confirm your address.',
      doneUS: 'You are on the list. We will email you when the beta opens.',
      switchText: 'Run a shelter or rescue? Join the Auli for Shelters waitlist →'
    },
    shelter: {
      headline: 'One workspace for every dog in your care.',
      sub: 'Auli for Shelters: bulk intake, shared health tracking and daily care logs, built for rescues and shelters.',
      points: [
        'Intake dogs in bulk by CSV or QR code',
        'Roles for owners, managers, caretakers, volunteers and vets',
        'Shared vaccination records, daily care logs and documents'
      ],
      cta: 'Request early access',
      legalUS: 'No spam. We will reach out to arrange a pilot.',
      legalEU: 'We will email once to confirm your address and to arrange a pilot. Unsubscribe any time. See our privacy policy.',
      doneEU: 'Thank you. We will email you shortly to confirm your address and arrange a pilot.',
      doneUS: 'Thank you. We will be in touch about a pilot.',
      switchText: 'Have a dog at home? Join the dog parent waitlist →'
    }
  }
};

/* ---------- Market + audience + attribution ---------- */
const qs = new URLSearchParams(location.search);
const guess = () => {
  const l = (navigator.language || 'en-US').toLowerCase();
  if (l.startsWith('de')) return 'de';
  if (l.startsWith('nl')) return 'nl';
  if (l === 'en-ie') return 'ie';
  if (l === 'en-gb') return 'uk';
  return 'us';
};
const marketKey = CONFIG.markets[qs.get('m')] ? qs.get('m') : guess();
const market = CONFIG.markets[marketKey];
const audience = qs.get('a') === 'shelter' ? 'shelter' : 'dog';
const t = CONFIG.audiences[audience];
// ?v= tags a creative variant. Example: ?m=uk&v=b&utm_source=meta&utm_campaign=launch1
const attribution = {
  market: marketKey, audience: audience, variant: qs.get('v') || 'a',
  utm_source: qs.get('utm_source') || '', utm_medium: qs.get('utm_medium') || '',
  utm_campaign: qs.get('utm_campaign') || '', utm_content: qs.get('utm_content') || ''
};

/* ---------- Render ---------- */
const $ = id => document.getElementById(id);
$('headline').textContent = t.headline;
$('sub').textContent = t.sub;
t.points.forEach(p => { const li = document.createElement('li'); li.textContent = p; $('points').appendChild(li); });
$('email-label').textContent = 'Email address';
$('cta').textContent = t.cta;
$('legal').textContent = market.consent ? t.legalEU : t.legalUS;
if (!market.consent) $('dnss').hidden = false;

const other = new URLSearchParams(location.search);
audience === 'dog' ? other.set('a', 'shelter') : other.delete('a');
$('switch').textContent = t.switchText;
$('switch').href = '?' + other.toString();

if (audience === 'dog') {
  $('price-legend').textContent = t.priceLegend;
  $('price-hint').textContent = t.priceHint;
  const fmt = new Intl.NumberFormat(market.locale, { style: 'currency', currency: market.currency });
  market.prices.forEach(p => {
    const label = document.createElement('label');
    label.innerHTML = '<input type="radio" name="price"><strong></strong><span>per month</span>';
    label.querySelector('input').value = p;
    label.querySelector('strong').textContent = fmt.format(p);
    label.querySelector('input').addEventListener('change', () => track('price_click', { price: p, currency: market.currency }));
    $('prices').appendChild(label);
  });
} else {
  $('price-set').hidden = true;
  $('org-field').hidden = false;
  $('dogs-field').hidden = false;
}

/* ---------- Consent-gated tracking ---------- */
const CONSENT_KEY = 'auli_consent';
const safeGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const hasConsent = () => !market.consent || safeGet(CONSENT_KEY) === 'yes';
const optedOutUS = () => safeGet('auli_dnss') === 'yes';

function send(payload) {
  if (!CONFIG.endpoint) { console.log('[auli]', payload); return; }
  const body = JSON.stringify(payload);
  if (payload.event !== 'signup' && navigator.sendBeacon) {
    navigator.sendBeacon(CONFIG.endpoint, new Blob([body], { type: 'text/plain' }));
  } else {
    fetch(CONFIG.endpoint, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: body, keepalive: true }).catch(() => {});
  }
}
function track(name, extra) {
  if (!hasConsent() || optedOutUS()) return;
  send(Object.assign({ event: name, ts: new Date().toISOString() }, attribution, extra || {}));
}

if (market.consent && safeGet(CONSENT_KEY) === null) {
  $('consent').style.display = 'block';
  $('consent-yes').onclick = () => { safeSet(CONSENT_KEY, 'yes'); $('consent').style.display = 'none'; track('page_view'); };
  $('consent-no').onclick = () => { safeSet(CONSENT_KEY, 'no'); $('consent').style.display = 'none'; };
}
$('dnss').onclick = e => { e.preventDefault(); safeSet('auli_dnss', 'yes'); e.target.textContent = 'Preference saved'; };
track('page_view');

/* ---------- Signup ---------- */
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const email = $('email').value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { alert('Please enter a valid email address.'); return; }
  const chosen = document.querySelector('input[name=price]:checked');
  // A signup is the visitor's own request, so it is sent even without analytics consent.
  send(Object.assign({
    event: 'signup', ts: new Date().toISOString(), email: email,
    price: chosen ? Number(chosen.value) : null, currency: market.currency,
    org: audience === 'shelter' ? $('org').value.trim() : '',
    dogs_in_care: audience === 'shelter' ? Number($('dogs').value) || 0 : null,
    double_opt_in: market.consent
  }, attribution));
  $('form').hidden = true;
  $('done').textContent = market.consent ? t.doneEU : t.doneUS;
  $('done').style.display = 'block';
});
</script>
</body>
</html>
